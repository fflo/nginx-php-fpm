---
name: 'build images'

# Tag the repo with the PHP version you are shipping, e.g. 8.4.27, 8.3.36 or 8.2.35.
#  - the <major><minor> part selects the Dockerfile (8.4.27 -> Dockerfile_84)
#  - the image is pushed as :<tag>, :<major>.<minor> and :<short-sha>
#  - :latest is added only when <major>.<minor> matches the FROM line of ./Dockerfile
# A rebuild of the same PHP version (e.g. a changed script) can be tagged 8.4.27-1, 8.4.27-2, ...
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${GITHUB_REPOSITORY#*/}
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          SHORTREF=${GITHUB_SHA::8}

          PHP_VERSION=${TAG%%-*}                       # 8.4.27-1 -> 8.4.27
          MAJOR_MINOR=${PHP_VERSION%.*}                # 8.4.27   -> 8.4
          DOCKERFILE="Dockerfile_${MAJOR_MINOR/./}"    # 8.4      -> Dockerfile_84
          if [ ! -f "$DOCKERFILE" ]; then
            DOCKERFILE=Dockerfile
          fi

          TAGS="${DOCKER_IMAGE}:${TAG},${DOCKER_IMAGE}:${MAJOR_MINOR},${DOCKER_IMAGE}:${SHORTREF}"

          # :latest follows whatever PHP line ./Dockerfile is on
          DEFAULT_MM=$(sed -n 's/^FROM php:\([0-9]*\.[0-9]*\)\..*/\1/p' Dockerfile)
          if [ "$MAJOR_MINOR" = "$DEFAULT_MM" ]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          echo "Building $DOCKERFILE as $TAGS"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "docker_image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./${{ steps.prep.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
